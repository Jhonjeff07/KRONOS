<style>
:root{--bg:#EEF6F3;--card:#fff;color-scheme:light;--ink:#1B1F23;--mu:#5B6169;--line:#D3E3DE;--g:#0F6B63;--gl:#DCEFEC;--gold:#D9A441;--dk:#14231F;--red:#B4413C;--redl:#F7DAD7;--track:#D9EAE5;--bd:#BCD2CC;--late:#FFF4F3;--lateb:#E9B7B3;--t-g:#DCEFEC;--t-y:#FBEBD3;--t-r:#F7DAD7;--t-p:#E9E4F2;--t-v:#EFEAF8}
:root[data-theme=dark]{--bg:#0D1513;--card:#16221F;--ink:#F5F8F6;--mu:#AEBDB8;color-scheme:dark;--line:#2A3A35;--gl:#1B3A34;--redl:#3E1F1D;--track:#2A3833;--bd:#3A4A44;--late:#2E1A19;--lateb:#6B3A37;--t-g:#1B3A34;--t-y:#3A2D14;--t-r:#3E1F1D;--t-p:#2C2540;--t-v:#2E2A44;--g:#34A89B;--red:#E0716B}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0D1513;--card:#16221F;--ink:#F5F8F6;--mu:#AEBDB8;color-scheme:dark;--line:#2A3A35;--gl:#1B3A34;--redl:#3E1F1D;--track:#2A3833;--bd:#3A4A44;--late:#2E1A19;--lateb:#6B3A37;--t-g:#1B3A34;--t-y:#3A2D14;--t-r:#3E1F1D;--t-p:#2C2540;--t-v:#2E2A44;--g:#34A89B;--red:#E0716B}}
#alertb .mini{color:#1B1F23;background:#F6F5F1;border-color:#F6F5F1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
h1,h2{font-family:'Space Grotesk',Inter,sans-serif;margin:0}
.mu{color:var(--mu)}
.hid{display:none!important}
/* login */
#login{position:fixed;inset:0;background:var(--dk);color:#F6F5F1;display:flex;flex-direction:column;align-items:center;padding:40px 28px 24px;gap:18px;overflow:auto;z-index:20}
#login .box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
#login label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
#login input{min-height:48px;border-radius:12px;border:1px solid #3F5A53;background:#1E332D;color:#F6F5F1;padding:0 14px}
.bgold{min-height:48px;border-radius:14px;border:0;background:var(--gold);color:var(--dk);font-weight:700;font-size:15px}
.bline{min-height:48px;border-radius:14px;border:1px solid #3F5A53;background:transparent;color:#F6F5F1;font-weight:600;font-size:15px}
/* app */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 6px}
header h1{font-size:26px;flex-grow:1}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
#body{flex:1;min-height:0;display:flex;flex-direction:column}
#nav{order:2;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;border:0;background:transparent;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--mu)}
#nav button.on{color:var(--g);font-weight:600}
#pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
#pages::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding:6px 16px 20px;display:flex;flex-direction:column;gap:12px}
.pgi{width:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex-grow:1;min-width:0}
.big{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;color:var(--g)}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}.bar>i{display:block;height:100%;background:var(--g)}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--track)}
.it{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px}
.it.late{background:var(--late);border:1px solid var(--lateb)}
.it.run{border:2px solid var(--g)}
.ck{width:30px;height:30px;border-radius:9px;border:2px solid #8A9099;background:var(--card);flex:none;display:flex;align-items:center;justify-content:center;padding:0}
.ck.on{background:var(--g);border-color:var(--g)}
.ck svg{display:none}.ck.on svg{display:block}
.it b{font-size:15px;font-weight:500}.it.dn b{text-decoration:line-through;color:var(--mu)}
.it small{display:block;font-size:12px;color:var(--mu)}.it.late small{color:#9A322D;font-weight:600}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap}
.mini{min-height:36px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 10px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.b1{min-height:44px;border-radius:12px;border:0;background:var(--g);color:#fff;font-weight:600;font-size:14px;padding:0 16px}
.b2{min-height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-weight:600;font-size:14px;padding:0 16px}
.bd{min-height:44px;border-radius:12px;border:1px solid var(--lateb);background:var(--card);color:var(--red);font-weight:600;font-size:14px;padding:0 16px}
.tmr{background:var(--dk);color:#F6F5F1;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.tmr .t{font-family:'Space Grotesk',sans-serif;font-size:28px}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.tag{display:flex;flex-wrap:wrap;gap:8px}
.grip{touch-action:none;cursor:grab;letter-spacing:-2px;padding:0 8px;user-select:none}
.empty{color:var(--mu);font-size:14px;padding:6px 2px}
dialog{border:0;border-radius:20px;padding:0;width:min(92vw,420px);max-height:88vh;overflow:auto;color:var(--ink);background:var(--card)}
select option{background:var(--card);color:var(--ink)}
:root[data-theme=dark] .chip{filter:brightness(1.7)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .chip{filter:brightness(1.7)}}
dialog::backdrop{background:rgba(20,35,31,.55)}
.f{padding:20px;display:flex;flex-direction:column;gap:12px}
.f label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.f input,.f select,.f textarea{min-height:46px;border-radius:12px;border:1px solid var(--bd);padding:0 12px;background:var(--card)}
.f textarea{padding:10px 12px;min-height:80px}
.fb{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{flex-direction:row;align-items:center;gap:4px;font-weight:500;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;min-height:40px}
/* tour */
#tour{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:28px 24px;overflow:auto}
#tour .in{width:100%;max-width:440px;flex:1;display:flex;flex-direction:column;gap:18px}
.dots{display:flex;gap:6px}.dots i{width:26px;height:6px;border-radius:3px;background:var(--track)}.dots i.on{background:var(--g)}
.ill{height:200px;border-radius:20px;background:var(--card);display:flex;align-items:center;justify-content:center;padding:16px;font-size:14px;text-align:center;line-height:1.5}
.tx{position:relative}.tx .gh{visibility:hidden}.tx .ty{position:absolute;left:0;top:0}
#tour h1{font-size:27px;line-height:1.15}
#tour p{margin:0;font-size:15px;line-height:1.55;color:var(--mu)}
@media(min-width:900px){
 #body{flex-direction:row}
 #nav{order:0;flex-direction:column;width:210px;border-top:0;border-right:1px solid var(--line);padding:12px 10px;gap:4px}
 #nav button{flex:none;flex-direction:row;justify-content:flex-start;min-height:44px;padding:0 12px;border-radius:10px;gap:10px;font-size:14px}
 #nav button.on{background:var(--gl)}
}
@media(prefers-reduced-motion:reduce){#pages{scroll-behavior:auto}}
</style>
</head>

 S.acts.forEach(a=>{if(a.sh&&!a.auto){const nid="wk:"+a.sh;mv[a.id]=nid}});

 const mm=k=>{const d=k.slice(0,10),r=k.slice(11);return mv[r]&&mv[r]!==r?d+"|"+mv[r]:k};
 ["done","ovr","ext"].forEach(f=>{const o=S[f]||{},n={};for(const k in o)n[mm(k)]=o[k];S[f]=n});
 (S.runs||[]).forEach(r=>{if(mv[r.id])r.id=mv[r.id]});if(S.timer&&S.timer.act&&mv[S.timer.act])S.timer.act=mv[S.timer.act];
 S.acts=S.acts.filter(a=>!a.auto&&!a.sh&&!a.sg);const out=[];
 T.forEach(x=>{const s0=hm(x.t),e0=s0+x.dur,mk=(id,n,c,t0,dur,kd)=>t0<0||t0>=1440||dur<=0?null:{id,kind:kd,est:1,n,cat:c,days:[1,2,3,4,5,6,7],t:mh(t0),dur:Math.min(dur,1440-t0),sg:x.id,auto:1},b="au:wk:"+x.id+":";

  [mk(b+"pre","Alistarme","nec",s0-x.ida-x.pre,x.pre,"pre"),mk(b+"ida","Traslado al trabajo","tra",s0-x.ida,x.ida,"ida"),mk(b+"vuelta","Traslado de regreso","tra",e0,x.vuelta,"vuelta"),mk(b+"post","Comer y estar listo","nec",e0+x.vuelta,x.post,"post")].forEach(z=>z&&out.push(z))});
 S.acts.push(...out)}
